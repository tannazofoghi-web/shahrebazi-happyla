<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <title>جشن‌ها و مسابقات - هپیلا</title>
  <link rel="stylesheet" href="events.css">
</head>
<body class="events-body">
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="sparkle sparkle-one" aria-hidden="true">✦</div>
  <div class="sparkle sparkle-two" aria-hidden="true">✧</div>
  <div class="sparkle sparkle-three" aria-hidden="true">✦</div>
  <div class="sparkle sparkle-four" aria-hidden="true">✧</div>

  <main class="events-page">
    <header class="event-banner">
      <div class="event-icon" aria-hidden="true">🎉</div>
      <p class="small-title">دنیای شادی‌های هپیلا</p>
      <h1>جشن‌ها و مسابقات</h1>
      <p class="banner-subtitle">لحظه‌های رنگی، خاطره‌های ماندگار ✨</p>
      <div class="rainbow-line" aria-hidden="true"></div>
    </header>

    <section id="event-content" aria-live="polite" aria-atomic="true">
      <div class="empty-event">
        <div class="empty-icon" aria-hidden="true">🎈</div>
        <h2>جشن و رویداد فعالی نداریم</h2>
        <p>اما کلی شادی و اتفاق هیجان‌انگیز در راهه! منتظر خبرهای رنگی هپیلا باش 💜</p>
      </div>
    </section>

    <a href="index.html" class="back-button"><span aria-hidden="true">⌂</span> بازگشت به هپیلا</a>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      /*
       * تنظیم رویداد:
       * برای نمایش جشن یا مسابقه، active را true کنید و startAt را با تاریخ و ساعت آینده
       * به قالب YYYY-MM-DDTHH:mm:ss وارد کنید. ساعت بر اساس منطقه زمانی دستگاه بازدیدکننده است.
       * برای نمایش حالت بدون رویداد، active را false بگذارید.
       */
      const eventInfo = {
        active:false,
        title: "جشن تولد هپیلا",
        type: "جشن",
        description: "با ما یک روز پر از شادی، بازی و جایزه‌های هیجان‌انگیز بساز!",
        startAt: "2026-11-14T17:00:00"
      };

      const contentContainer = document.getElementById("event-content");
      if (!contentContainer) return;

      const faDate = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
        year: "numeric", month: "long", day: "numeric"
      });
      const faDay = new Intl.DateTimeFormat("fa-IR", { weekday: "long" });
      const faTime = new Intl.DateTimeFormat("fa-IR", { hour: "2-digit", minute: "2-digit" });
      const faNumber = value => new Intl.NumberFormat("fa-IR", { minimumIntegerDigits: 2, useGrouping: false }).format(value);

      const startAt = new Date(eventInfo.startAt);
      // نمایش رویداد فقط به active وابسته است؛ تاریخ گذشته باعث پنهان شدن کارت نمی‌شود.
      const hasUpcomingEvent = eventInfo.active === true &&
        eventInfo.title.trim() !== "" &&
        !Number.isNaN(startAt.getTime());

      if (!hasUpcomingEvent) {
        contentContainer.innerHTML = `
          <div class="empty-event">
            <div class="empty-icon" aria-hidden="true">🎈</div>
            <span class="status-pill status-idle">فعلاً در حال استراحتیم</span>
            <h2>جشن و رویداد فعالی نداریم</h2>
            <p>اما کلی شادی و اتفاق هیجان‌انگیز در راهه! منتظر خبرهای رنگی هپیلا باش 💜</p>
            <div class="empty-confetti" aria-hidden="true">✦ ✧ 🎊 ✧ ✦</div>
          </div>`;
        return;
      }

      contentContainer.innerHTML = `
        <article class="active-event-card">
          <div class="card-glow" aria-hidden="true"></div>
          <span class="status-pill"><span class="status-dot"></span> ${eventInfo.type} پیشِ رو</span>
          <h2>${escapeHtml(eventInfo.title)}</h2>
          <p class="event-desc">${escapeHtml(eventInfo.description)}</p>
          <div class="event-details-grid">
            <div class="detail-item"><span>📅 تاریخ</span><strong id="event-date"></strong></div>
            <div class="detail-item"><span>🗓 روز</span><strong id="event-day"></strong></div>
            <div class="detail-item"><span>⏰ ساعت</span><strong id="event-time"></strong></div>
          </div>
          <div class="countdown-section">
            <p class="countdown-title"><span aria-hidden="true">⏳</span> زمان باقی‌مانده تا شروع ${eventInfo.type}</p>
            <div class="countdown" role="timer" aria-live="off">
              <div class="time-unit"><strong id="cd-days">۰۰</strong><span>روز</span></div>
              <div class="time-separator">:</div>
              <div class="time-unit"><strong id="cd-hours">۰۰</strong><span>ساعت</span></div>
              <div class="time-separator">:</div>
              <div class="time-unit"><strong id="cd-minutes">۰۰</strong><span>دقیقه</span></div>
              <div class="time-separator">:</div>
              <div class="time-unit"><strong id="cd-seconds">۰۰</strong><span>ثانیه</span></div>
            </div>
          </div>
          <div class="event-footer-note">آماده‌ای برای یه عالمه هیجان؟ 💖</div>
        </article>`;

      document.getElementById("event-date").textContent = faDate.format(startAt);
      document.getElementById("event-day").textContent = faDay.format(startAt);
      document.getElementById("event-time").textContent = faTime.format(startAt);

      let countdownInterval;
      function updateCountdown() {
        const remaining = startAt.getTime() - Date.now();
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          const countdownSection = contentContainer.querySelector(".countdown-section");
          if (countdownSection) {
            countdownSection.innerHTML = `<p class="countdown-title">🎊 ${escapeHtml(eventInfo.title)} شروع شده!</p><p class="countdown-title">وقتشه از جشن لذت ببری 💜</p>`;
          }
          return;
        }
        const totalSeconds = Math.floor(remaining / 1000);
        document.getElementById("cd-days").textContent = faNumber(Math.floor(totalSeconds / 86400));
        document.getElementById("cd-hours").textContent = faNumber(Math.floor((totalSeconds % 86400) / 3600));
        document.getElementById("cd-minutes").textContent = faNumber(Math.floor((totalSeconds % 3600) / 60));
        document.getElementById("cd-seconds").textContent = faNumber(totalSeconds % 60);
      }
      updateCountdown();
      countdownInterval = setInterval(updateCountdown, 1000);

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[char]);
      }
    });
  </script>
</body>
</html>
